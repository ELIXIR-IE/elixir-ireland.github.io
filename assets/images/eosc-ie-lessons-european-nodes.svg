<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Building EOSC Ireland: Lessons from European EOSC Nodes</title>
  <desc id="desc">A blue and orange graphic marking the publication of a report capturing lessons from visits to six established European EOSC Nodes, informing the design of EOSC Ireland.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fbff" />
      <stop offset="100%" stop-color="#fff7f2" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#023452" />
      <stop offset="100%" stop-color="#0a5f8f" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f47920" />
      <stop offset="100%" stop-color="#ffae63" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#023452" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" rx="24" />
  <circle cx="125" cy="100" r="72" fill="#f47920" opacity="0.10" />
  <circle cx="1085" cy="520" r="92" fill="#023452" opacity="0.10" />
  <circle cx="1030" cy="120" r="50" fill="#f47920" opacity="0.14" />

  <rect x="80" y="60" width="1040" height="126" rx="24" fill="url(#blueGrad)" filter="url(#shadow)" />
  <text x="600" y="115" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff">EOSC IRELAND</text>
  <text x="600" y="152" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#d8edf9">New report published on Zenodo</text>

  <!-- Federation motif: Ireland at the centre, six European Nodes around it -->
  <g>
    <g stroke="#0a5f8f" stroke-opacity="0.35" stroke-width="3">
      <line x1="600" y1="350" x2="600" y2="228" />
      <line x1="600" y1="350" x2="706" y2="289" />
      <line x1="600" y1="350" x2="706" y2="411" />
      <line x1="600" y1="350" x2="600" y2="472" />
      <line x1="600" y1="350" x2="494" y2="411" />
      <line x1="600" y1="350" x2="494" y2="289" />
    </g>
    <g fill="url(#blueGrad)">
      <circle cx="600" cy="222" r="24" />
      <circle cx="712" cy="286" r="24" />
      <circle cx="712" cy="414" r="24" />
      <circle cx="600" cy="478" r="24" />
      <circle cx="488" cy="414" r="24" />
      <circle cx="488" cy="286" r="24" />
    </g>
    <circle cx="600" cy="350" r="46" fill="url(#orangeGrad)" filter="url(#shadow)" />
    <circle cx="600" cy="350" r="20" fill="#ffffff" />
  </g>

  <text x="600" y="546" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#023452">Building EOSC Ireland</text>
  <text x="600" y="588" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#4a4a4a">Lessons from six European EOSC Nodes</text>

</svg>
