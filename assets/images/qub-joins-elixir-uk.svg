<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Queen's University Belfast joins ELIXIR-UK</title>
  <desc id="desc">A blue and orange graphic marking Queen's University Belfast as a new institutional member of ELIXIR-UK, extending the Node into Northern Ireland.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fbff" />
      <stop offset="100%" stop-color="#fff7f2" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#023452" />
      <stop offset="100%" stop-color="#0a5f8f" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f47920" />
      <stop offset="100%" stop-color="#ffae63" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#023452" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" rx="24" />
  <circle cx="125" cy="100" r="72" fill="#f47920" opacity="0.10" />
  <circle cx="1085" cy="520" r="92" fill="#023452" opacity="0.10" />
  <circle cx="1030" cy="120" r="50" fill="#f47920" opacity="0.14" />

  <rect x="80" y="70" width="1040" height="132" rx="24" fill="url(#blueGrad)" filter="url(#shadow)" />
  <text x="600" y="128" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff">ELIXIR-UK</text>
  <text x="600" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#d8edf9">Welcomes a new institutional member</text>

  <!-- Location pin marking Northern Ireland -->
  <g transform="translate(600,330)">
    <path d="M0,-70 C40,-70 70,-40 70,0 C70,45 25,90 0,120 C-25,90 -70,45 -70,0 C-70,-40 -40,-70 0,-70 Z" fill="url(#orangeGrad)" filter="url(#shadow)" />
    <circle cx="0" cy="-4" r="30" fill="#ffffff" />
    <circle cx="0" cy="-4" r="14" fill="#023452" />
  </g>

  <text x="600" y="500" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#023452">Queen's University Belfast</text>
  <text x="600" y="546" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#4a4a4a">Extending the Node into Northern Ireland</text>

</svg>
